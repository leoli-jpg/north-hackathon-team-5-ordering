# RFC-0001: NexAU 多人点餐推荐 Agent - T1 项目骨架与工具绑定
#
# 该配置文件定义本地 NexAU Ordering Agent。首期骨架绑定 NexAU 原生
# read_file/read_many_files/list_directory/glob/read_visual_file 工具，并预留
# 本地领域工具绑定入口，供 T2-T5 逐步替换 mock 或扩展为真实工具。

type: agent
name: nexau-ordering-agent
description: >
  RFC-0001 多人点餐推荐 Agent。读取文字菜单/菜单图片路径、预算、人数和
  成员自然语言需求，调用本地工具解析与校验，输出可解释点餐方案。

system_prompt_type: file
system_prompt: ./systemprompt.md

llm_config:
  model: ${env.LLM_MODEL}
  base_url: ${env.LLM_BASE_URL}
  api_key: ${env.LLM_API_KEY}
  temperature: 0
  max_tokens: 4096
  timeout: 120
  api_type: openai_chat_completion

tool_call_mode: structured
max_iterations: 40
timeout: 300
retry_attempts: 3

# 本地 smoke test 默认限制在仓库根目录内；需要更宽/更窄范围时可在
# .env.example 中设置 SANDBOX_WORK_DIR。
sandbox_config:
  type: local
  work_dir: ${env.SANDBOX_WORK_DIR}
  respect_git_ignore: true

# T1 原生文件/视觉工具绑定。NexAU 内置 read_visual_file 支持 PNG/JPG/GIF/WEBP/SVG/BMP
# 以及 MP4/AVI/MOV/MKV/WEBM/FLV/WMV/M4V；菜单图片场景应使用多模态模型。
tools:
  - name: read_file
    yaml_path: ./tools/native/read_file.yaml
    binding: nexau.archs.tool.builtin.file_tools:read_file
  - name: read_many_files
    yaml_path: ./tools/native/read_many_files.yaml
    binding: nexau.archs.tool.builtin.file_tools:read_many_files
  - name: list_directory
    yaml_path: ./tools/native/list_directory.yaml
    binding: nexau.archs.tool.builtin.file_tools:list_directory
  - name: glob
    yaml_path: ./tools/native/glob.yaml
    binding: nexau.archs.tool.builtin.file_tools:glob
  - name: read_visual_file
    yaml_path: ./tools/native/read_visual_file.yaml
    binding: nexau.archs.tool.builtin.file_tools:read_visual_file

  # T1 预留本地工具绑定；后续子任务会逐步补齐真实实现和测试。
  - name: run_ordering_mock
    yaml_path: ./tools/local/run_ordering_mock.yaml
    binding: agents.ordering_agent.tools.mock_ordering:run_ordering_tool
