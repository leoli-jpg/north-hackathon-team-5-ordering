# RFC-0001: NexAU 多人点餐推荐 Agent - 原生 glob 工具
#
# 用于按模式查找菜单、请求或视觉菜单文件。

type: tool
name: glob
description: >
  Find files matching a glob pattern. Use this to locate sample menus, request
  files, or local menu images before reading them.
input_schema:
  type: object
  properties:
    pattern:
      type: string
      description: Glob pattern to search for, such as "data/*.txt" or "**/*.jpg".
    dir_path:
      type: string
      description: Optional directory to search in.
    case_sensitive:
      type: boolean
      description: Whether matching should be case-sensitive.
      default: false
    respect_git_ignore:
      type: boolean
      description: Whether to respect .gitignore patterns.
      default: true
  required:
    - pattern
disable_parallel: false
lazy: false
defer_loading: false
