# RFC-0002: NexAU Agent skill 工具 - 发起推荐
#
# 该工具将 Agent 解析出的预算、人数和成员约束转换为 apps/api 推荐接口请求。

type: tool
name: create_recommendation
description: >-
  Create a recommendation through the ordering API. The Agent should pass the
  structured budget, person count, and member constraints produced from the
  user's natural-language request.
input_schema:
  type: object
  properties:
    budget_cents:
      type: integer
      minimum: 1
      description: Total budget in cents.
    person_count:
      type: integer
      minimum: 1
      description: Number of people to order for.
    member_constraints:
      type: array
      description: Member allergies, dislikes, spicy tolerance, and preferences.
      items:
        type: object
        properties:
          member_id:
            type: string
            description: Stable member label such as A, B, or 张三.
          allergies:
            type: array
            items:
              type: string
            description: Allergies or ingredients to avoid.
          dislikes:
            type: array
            items:
              type: string
            description: Disliked ingredients or categories.
          spicy_tolerance:
            type: string
            enum:
              - none
              - mild
              - medium
              - hot
              - unspecified
            description: Maximum acceptable spicy level.
          preferences:
            type: array
            items:
              type: string
            description: Positive preferences to favor when possible.
        required:
          - member_id
        additionalProperties: false
  required:
    - budget_cents
    - person_count
    - member_constraints
  additionalProperties: false
disable_parallel: false
lazy: false
defer_loading: false
binding: services.agent.skills.api_client:create_recommendation_tool
