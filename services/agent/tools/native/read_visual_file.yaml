# RFC-0001: NexAU 多人点餐推荐 Agent - 原生 read_visual_file 工具
#
# 读取菜单图片或视频，并把视觉内容交给多模态 LLM。首期不承诺 OCR 准确率，
# 仅要求 Agent 能调用该工具读取视觉菜单路径。

type: tool
name: read_visual_file
description: >
  Read an image or video file by path and return visual content for a multimodal
  LLM. Supported image formats include PNG/JPG/GIF/WEBP/SVG/BMP/TIFF; supported
  video formats include MP4/AVI/MOV/MKV/WEBM/FLV/WMV/M4V.
input_schema:
  type: object
  properties:
    file_path:
      type: string
      description: Path to the image or video menu file.
    image_detail:
      type: string
      enum:
        - low
        - high
        - auto
      description: Optional image detail level for vision models.
    image_max_size:
      type: integer
      minimum: 1
      description: Optional maximum image width for resizing before sending to the model.
    video_frame_interval:
      type: integer
      minimum: 1
      description: Optional seconds between extracted video frames.
    video_max_frames:
      type: integer
      minimum: 1
      description: Optional maximum number of video frames to return.
    video_frame_width:
      type: integer
      minimum: 1
      description: Optional video frame width after extraction.
  required:
    - file_path
disable_parallel: false
lazy: false
defer_loading: false
